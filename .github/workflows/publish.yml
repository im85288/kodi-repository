name: Publish
# Builds the repository from each add-on's latest GitHub release and serves
# it with GitHub Pages. Hourly, so a release reaches Kodi without either
# add-on's workflow needing a token for this repository; by hand (Actions >
# Publish) to publish one at once.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
    - name: Build
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 build.py site
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: site
    - id: deploy
      uses: actions/deploy-pages@v4
